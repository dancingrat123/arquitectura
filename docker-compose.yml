version: "3.9"

services:
  gateway:
    image: nginx:alpine
    container_name: sirif-gateway
    ports:
      - "9080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - data-service
      - risk-service

  frontend:
    build: ./frontend
    container_name: sirif-frontend
    expose:
      - "80"

  data-service:
    build: ./data-service
    container_name: sirif-data-service
    ports:
      - "9000:8000"

  risk-service:
    build: ./risk-service
    container_name: sirif-risk-service
    ports:
      - "9001:8001"