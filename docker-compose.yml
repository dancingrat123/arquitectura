services:
  gateway:
    image: nginx:alpine
    container_name: sirif-gateway
    ports:
      - "9080:80"
      - "9443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/nginx.crt:/etc/nginx/nginx.crt:ro
      - ./gateway/nginx.key:/etc/nginx/nginx.key:ro
    depends_on:
      - frontend
      - api-service
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: sirif-frontend
    expose:
      - "80"
    restart: always

  api-service:
    build: ./api-service
    expose:
      - "8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATA_SERVICE_URL: http://data-service:8000
      RISK_SERVICE_URL: http://risk-service:8001
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      UMBRAL_ALERTA: ${UMBRAL_ALERTA:-0.50}
      PESO_RIESGO: ${PESO_RIESGO:-0.5}
      PESO_VIVIENDAS: ${PESO_VIVIENDAS:-0.2}
      PESO_INFRA: ${PESO_INFRA:-0.15}
      PESO_VEGETACION: ${PESO_VEGETACION:-0.15}
      GEOJSON_PATH: /app/datos/geo/distritos_filtrados.geojson
      LLM_URL: ${LLM_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    volumes:
      - ./shared:/app/shared:ro
      - ./frontend/data:/app/datos/geo:ro
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  data-service:
    build: ./data-service
    container_name: sirif-data-service
    expose:
      - "8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      ANALISTA_PASSWORD_HASH: ${ANALISTA_PASSWORD_HASH:-}
      VISUALIZADOR_PASSWORD_HASH: ${VISUALIZADOR_PASSWORD_HASH:-}
      OPEN_METEO_URL: ${OPEN_METEO_URL:-https://api.open-meteo.com/v1/forecast}
      OPEN_METEO_TIMEOUT: ${OPEN_METEO_TIMEOUT:-30}
    volumes:
      - ./ml-pipeline:/app/datos/ml:ro
      - ./frontend/data:/app/datos/geo:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always

  risk-service:
    build: ./risk-service
    container_name: sirif-risk-service
    expose:
      - "8001"
    environment:
      MODEL_VERSION: ${MODEL_VERSION:-rf-clima-region-v2}
      MODEL_METADATA_PATH: /app/model_metadata.json
      MODEL_METADATA_COMUNAL_PATH: /app/model_metadata_comunal.json
      UMBRAL_ALTO_COMUNAL: ${UMBRAL_ALTO_COMUNAL:-0.15}
      UMBRAL_MEDIO_COMUNAL: ${UMBRAL_MEDIO_COMUNAL:-0.05}
    volumes:
      - ./shared:/app/shared:ro
      - ./ml-pipeline/model_metadata.json:/app/model_metadata.json:ro
      - ./ml-pipeline/model_metadata_comunal.json:/app/model_metadata_comunal.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always

  monitoring-service:
    build: ./monitoring-service
    container_name: sirif-monitoring-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      DATA_SERVICE_URL: http://data-service:8000
      API_SERVICE_URL: http://api-service:8000
      RISK_SERVICE_URL: http://risk-service:8001
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      MONITORING_INTERVAL: ${MONITORING_INTERVAL:-3600}
      NDVI_FILE: ${NDVI_FILE:-/app/datos/ml/ndvi_ejemplo.json}
      NDVI_URL: ${NDVI_URL:-}
    volumes:
      - ./ml-pipeline:/app/datos/ml:ro
    depends_on:
      db:
        condition: service_healthy
      data-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  notification-service:
    build: ./notification-service
    container_name: sirif-notification-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sirif-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: sirif-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sirif
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d sirif"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: always

  # ===== Stack de monitoreo =====
  prometheus:
    image: prom/prometheus:latest
    container_name: sirif-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: sirif-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: sirif-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: sirif-node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped

volumes:
  db_data:
  grafana_data: