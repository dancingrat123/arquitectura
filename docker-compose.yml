version: "3.9"

services:
  gateway:
    image: nginx:alpine
    container_name: sirif-gateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - data-service
      - risk-service

  data-service:
    build: ./data-service
    container_name: sirif-data-service
    ports:
      - "8000:8000"

  risk-service:
    build: ./risk-service
    container_name: sirif-risk-service
    ports:
      - "8001:8001"