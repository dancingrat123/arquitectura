events { worker_connections 1024; }

http {
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream frontend_service {
        server frontend:80;
    }
    upstream api_service {
        server api-service:8000;
    }
    upstream data_service {
        server data-service:8000;
    }

    # Redirigir todo el tráfico HTTP al HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host:9443$request_uri;
    }

    # Servidor HTTPS
    server {
        listen 443 ssl;
        server_name _;

        # Certificados SSL
        ssl_certificate /etc/nginx/nginx.crt;
        ssl_certificate_key /etc/nginx/nginx.key;
        
        # Configuración recomendada de seguridad TLS
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Ruta para obtener el token JWT (Login)
        location /token {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://api_service/token;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Ruta especifica de riesgo
        location /api/riesgo/todas {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_service/api/riesgo/todas;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization; 
        }

        # Ruta generica de riesgo
        location /api/riesgo/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_service/api/riesgo/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Ruta de datos
        location /api/datos/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://data_service/datos/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Frontend
        location / {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://frontend_service/;
            proxy_set_header Host $host;
        }
    }
}