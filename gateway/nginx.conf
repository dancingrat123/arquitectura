events { worker_connections 1024; }

http {
    # Rate limiting: 10 solicitudes por segundo por IP, con ráfaga de 20
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream frontend_service {
        server frontend:80;
    }
    upstream api_service {
        server api-service:8000;
    }
    upstream data_service {
        server data-service:8000;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Ruta especifica
        location /api/riesgo/todas {
            auth_basic "SIRIF API";
            auth_basic_user_file /etc/nginx/.htpasswd;
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_service/api/riesgo/todas;
            proxy_set_header Host $host;
        }

        # Ruta generica de riesgo
        location /api/riesgo/ {
            auth_basic "SIRIF API";
            auth_basic_user_file /etc/nginx/.htpasswd;
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_service/api/riesgo/;
            proxy_set_header Host $host;
        }

        # Ruta de datos (distritos)
        location /api/datos/ {
            auth_basic "SIRIF API";
            auth_basic_user_file /etc/nginx/.htpasswd;
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://data_service/datos/;
            proxy_set_header Host $host;
        }

        # Frontend: sin autenticacion, pero con rate limiting suave
        location / {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://frontend_service/;
            proxy_set_header Host $host;
        }
    }
}