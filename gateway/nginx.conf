events { worker_connections 1024; }

http {
    upstream frontend_service {
        server frontend:80;
    }
    upstream api_service {
        server api-service:8000;
    }

    server {
        listen 80;

        # Frontend
        location / {
            proxy_pass http://frontend_service/;
            proxy_set_header Host $host;
        }

        # API (ahora apunta al api-service, no directamente al risk)
        location /api/riesgo/ {
            proxy_pass http://api_service/api/riesgo/;
            proxy_set_header Host $host;
        }
    }
}