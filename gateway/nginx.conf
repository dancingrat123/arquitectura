events { worker_connections 1024; }

http {
    server_tokens off;
    # Cuando se supera un límite, responder 429 (no el 503 por defecto de Nginx).
    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # Fase 4: reportes, exportaciones y asistente tienen límites más estrictos.
    limit_req_zone $binary_remote_addr zone=fase4_limit:10m rate=2r/s;
    # Auto-registro público: 3 cuentas por minuto y por IP.
    limit_req_zone $binary_remote_addr zone=registro_limit:10m rate=3r/m;

    upstream frontend_service {
        server frontend:80;
    }
    upstream api_service {
        server api-service:8000;
    }
    upstream data_service {
        server data-service:8000;
    }

    # Redirigir todo el tráfico HTTP al HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host:9443$request_uri;
    }

    # Servidor HTTPS
    server {
        listen 443 ssl;
        server_name _;

        # Certificados SSL (generados en el volumen gateway_tls al primer arranque)
        ssl_certificate /etc/nginx/tls/nginx.crt;
        ssl_certificate_key /etc/nginx/tls/nginx.key;
        
        # Configuración recomendada de seguridad TLS
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # CSP: recursos propios; Leaflet usa estilos inline y las teselas vienen de OSM.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        # HSTS queda deshabilitado mientras el certificado sea autofirmado.

        # Ruta para obtener el token JWT (Login)
        location /token {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://api_service/token;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Acceso público de solo lectura: mapa de riesgo sin sesión.
        # El auto-registro tiene un límite propio y más estricto.
        location = /api/publico/registro {
            limit_req zone=registro_limit burst=5 nodelay;
            proxy_pass http://api_service/api/publico/registro;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/publico/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_service/api/publico/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Ruta especifica de riesgo
        location /api/riesgo/todas {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_service/api/riesgo/todas;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization; 
        }

        # Ruta generica de riesgo
        location /api/riesgo/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_service/api/riesgo/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Panel ejecutivo (Fase 1)
        location /api/panel/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_service/api/panel/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Comparador de zonas (Fase 1)
        location = /api/comparar {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_service/api/comparar;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Simulador de escenarios (Fase 2)
        location = /api/simular {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://api_service/api/simular;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Alertas y centro de notificaciones (Fase 2)
        location /api/alertas {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_service/api/alertas;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/notificaciones {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_service/api/notificaciones;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Estado de servicios (Fase 2)
        location /api/estado/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_service/api/estado/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Ruta de datos (la sincronización es interna: solo monitoring-service)
        location = /api/datos/sincronizar {
            return 404;
        }

        # Los datos espaciales se leen a través de api-service (JWT + rol);
        # api-service reenvía el X-Internal-Token a data-service.
        location /api/datos/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_service/api/datos/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Fase 4: reportes, exportaciones y asistente (límite estricto, S10).
        location /api/reportes/ {
            limit_req zone=fase4_limit burst=3 nodelay;
            proxy_pass http://api_service/api/reportes/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/exportar/ {
            limit_req zone=fase4_limit burst=3 nodelay;
            proxy_pass http://api_service/api/exportar/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/asistente/ {
            limit_req zone=fase4_limit burst=3 nodelay;
            proxy_pass http://api_service/api/asistente/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Endpoints de Fase 3: usuarios, prioridad, gestión territorial y bitácora.
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_service/api/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Frontend
        location / {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://frontend_service/;
            proxy_set_header Host $host;
        }
    }
}