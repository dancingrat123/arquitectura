events { worker_connections 1024; }

http {
    upstream frontend_service {
        server frontend:80;
    }
    upstream data_service {
        server data-service:8000;
    }
    upstream risk_service {
        server risk-service:8001;
    }

    server {
        listen 80;

        # Frontend (SPA)
        location / {
            proxy_pass http://frontend_service/;
            proxy_set_header Host $host;
        }

        # Data Service
        location /api/datos/ {
            proxy_pass http://data_service/datos/;
            proxy_set_header Host $host;
        }

        # Risk Service
        location /api/clasificar {
            proxy_pass http://risk_service/clasificar;
            proxy_set_header Host $host;
        }
    }
}