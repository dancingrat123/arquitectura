events { worker_connections 1024; }

http {
    upstream data_service {
        server data-service:8000;
    }
    upstream risk_service {
        server risk-service:8001;
    }

    server {
        listen 80;

        location / {
            return 200 '{"status":"ok","gateway":"SIRIF API Gateway","rutas":["/api/datos/{zona}","/api/clasificar"]}';
            add_header Content-Type application/json;
        }

        location /api/datos/ {
            proxy_pass http://data_service/datos/;
            proxy_set_header Host $host;
        }

        location /api/clasificar {
            proxy_pass http://risk_service/clasificar;
            proxy_set_header Host $host;
        }
    }
}